name: Refresh evidence

# Re-reads the git history and re-checks every claim each week. A claim that no
# longer holds fails this run, and GitHub emails the repository owner.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest
      - run: npm run verify
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git diff --cached --quiet || git commit -m "Refresh git history and evidence report"
          git push
      # Pushes made with this token don't start other workflows, so ask for the deploy directly.
      - run: gh workflow run deploy.yml --ref main
